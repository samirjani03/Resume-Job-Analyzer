services:
  - type: web
    name: talentmatch-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: REQUIRE_PROVIDER
        value: "true"
      - key: DAILY_QUOTA
        value: "20"
      - key: ALLOWED_ORIGINS
        value: "https://talentmatch.vercel.app"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./talentmatch.db